<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FNF Sprite Optimizer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101d;color:#fff;font-family:Arial,Helvetica,sans-serif;font-weight:700}
.wrap{max-width:680px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#2a174b,#17172d 48%,#10101d);padding-bottom:50px}
.hero{text-align:center;padding:34px 20px 25px}
.logo{width:68px;height:68px;margin:auto;border-radius:19px;background:#ff465b;display:grid;place-items:center;font-size:38px;box-shadow:0 12px 35px #ff465b44}
h1{font-size:39px;margin:14px 0 10px;letter-spacing:-1.5px}
.hero p{font-size:20px;line-height:1.35;color:#bfc1d0;margin:0}
.panel{margin:0 14px;background:#191a34;border:2px solid #713b54;border-radius:20px;overflow:hidden;box-shadow:0 15px 45px #0005}
.title{background:#d75b64;padding:20px 28px;font-size:27px}
.modes{padding:20px;border-bottom:2px solid #4d3048}
.mode{width:100%;border:2px solid #754354;background:#30314d;color:#fff;border-radius:13px;padding:17px;margin:0 0 12px;font-size:22px;font-weight:800}
.mode.active{background:#6e354c;border-color:#ff6870;box-shadow:0 0 12px #ff687044}
.mode:last-child{margin-bottom:0}
.drop{margin:24px;border:3px dashed #a64f61;border-radius:15px;padding:28px 22px;text-align:center}
.icon{font-size:48px;color:#d5d7e2}
.label{font-size:24px;margin:7px 0 22px}
.filebtn{display:block;width:100%;padding:19px;border:0;border-radius:12px;background:linear-gradient(100deg,#ff626a,#ff934d);color:#fff;font-size:21px;font-weight:800}
input{display:none}
.info{margin:0 24px 24px;background:#292a46;border-radius:12px;padding:15px;color:#c8cada;text-align:center;font-size:16px}
.scale{margin:0 24px 24px;background:#151629;border:1px solid #4c3650;border-radius:14px;padding:20px}
.scale b{font-size:21px}.scale span{float:right;color:#ff6875;font-size:22px}
input[type=range]{display:block;width:100%;margin-top:18px;accent-color:#ff6875}
.download{margin:0 24px 24px;width:calc(100% - 48px);padding:20px;border:0;border-radius:13px;background:#ff5264;color:white;font-size:22px;font-weight:900}
.download:disabled{opacity:.45}
.status{text-align:center;color:#b9bbca;min-height:24px;padding:0 20px 20px}
footer{text-align:center;color:#77798c;font-size:13px;padding:20px}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <div class="logo">✦</div>
  <h1>FNF Sprite Optimizer</h1>
  <p>Turn your spritesheet into separate animation-frame PNGs using the matching XML data. Everything runs in your browser.</p>
</section>

<section class="panel">
  <div class="title">Entrance</div>
  <div class="modes">
    <button class="mode">📄 ZIP</button>
    <button class="mode active">🖼️ Spritesheet + XML</button>
    <button class="mode">▱ Spritemap</button>
  </div>

  <div class="drop">
    <div class="icon">▧</div>
    <div class="label">PNG</div>
    <label class="filebtn" for="png">📤 Select PNG</label>
    <input id="png" type="file" accept="image/png">
  </div>

  <div class="drop">
    <div class="icon">&lt;/&gt;</div>
    <div class="label">XML</div>
    <label class="filebtn" for="xml">📤 Select XML</label>
    <input id="xml" type="file" accept=".xml,text/xml">
  </div>

  <div class="scale">
    <b>Frame Scale</b><span id="scaleText">1×</span>
    <input id="scale" type="range" min=".25" max="1" value="1" step=".05">
  </div>

  <button class="download" id="download" disabled>Download ZIP — Separate Frames</button>
  <div class="status" id="status">Select a PNG and matching XML.</div>
</section>
<footer>ZIP contains one PNG for every XML frame + the original XML.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let pngFile=null,xmlFile=null,img=null;
const $=id=>document.getElementById(id);
$("png").onchange=e=>{pngFile=e.target.files[0]||null;check()};
$("xml").onchange=e=>{xmlFile=e.target.files[0]||null;check()};
$("scale").oninput=e=>$("scaleText").textContent=Number(e.target.value).toFixed(2).replace(/\.00$/,"")+"×";

function check(){
 if(pngFile && xmlFile){$("download").disabled=false;$("status").textContent="Ready — your ZIP will contain separate frame PNGs."}
 else {$("download").disabled=true;$("status").textContent="Select a PNG and matching XML."}
}
function readFile(file,type){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;
  type==="text"?r.readAsText(file):r.readAsDataURL(file)
 })
}
function imageFromData(data){
 return new Promise((resolve,reject)=>{
  const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data
 })
}
function canvasBlob(c){return new Promise(r=>c.toBlob(r,"image/png"))}

$("download").onclick=async()=>{
 if(!pngFile||!xmlFile)return;
 try{
  $("status").textContent="Reading spritesheet and XML…";
  const data=await readFile(pngFile,"data");
  img=await imageFromData(data);
  const text=await readFile(xmlFile,"text");
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror"))throw new Error("Invalid XML");
  const nodes=[...doc.querySelectorAll("SubTexture")];
  if(!nodes.length)throw new Error("No SubTexture frames found");
  const s=Number($("scale").value);
  const zip=new JSZip();
  const base=pngFile.name.replace(/\.[^.]+$/,"");
  let manifest=[];
  for(let n=0;n<nodes.length;n++){
   const a=nodes[n].attributes;
   const get=k=>a.getNamedItem(k)?.value;
   const x=Number(get("x")||0),y=Number(get("y")||0);
   const w=Number(get("width")||0),h=Number(get("height")||0);
   const fw=Number(get("frameWidth")||w),fh=Number(get("frameHeight")||h);
   const fx=Number(get("frameX")||0),fy=Number(get("frameY")||0);

   const c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(fw*s));c.height=Math.max(1,Math.round(fh*s));
   const cx=c.getContext("2d");
   cx.imageSmoothingEnabled=false;

   // Rebuild the complete animation frame from the trimmed XML rectangle.
   cx.drawImage(img,x,y,w,h,
     Math.round(-fx*s),Math.round(-fy*s),
     Math.round(w*s),Math.round(h*s));

   const blob=await canvasBlob(c);
   const originalName=get("name")||("frame_"+String(n+1).padStart(4,"0"));
   const safe=originalName.replace(/[\\/:*?"<>|]/g,"_");
   zip.file("frames/"+String(n+1).padStart(4,"0")+"_"+safe+".png",blob);
   manifest.push({index:n+1,name:originalName,width:Math.round(fw*s),height:Math.round(fh*s)});
   $("status").textContent=`Creating frame ${n+1} of ${nodes.length}…`;
  }

  zip.file(base+".xml",text);
  zip.file("frames.json",JSON.stringify(manifest,null,2));
  const blob=await zip.generateAsync({type:"blob"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=base+"-frames.zip";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  $("status").textContent=`Done! ${nodes.length} separate frame PNGs are in the ZIP.`;
 }catch(e){
  console.error(e);$("status").textContent="Could not create ZIP: "+e.message;
 }
};
</script>
</body>
</html>
